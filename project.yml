name: Gullfire
options:
  bundleIdPrefix: io.github.big-shame-software
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  Gadgets:
    path: Packages/Gadgets
targets:
  GullfireKit:
    type: framework
    platform: macOS
    sources: [Sources/GullfireKit]
    dependencies:
      - package: Gadgets
        product: BSSMidiLoop
      - package: Gadgets
        product: BSSMidiPlayer
    settings:
      base:
        PRODUCT_NAME: GullfireKit
        PRODUCT_MODULE_NAME: GullfireKit
        DEFINES_MODULE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
  Gullfire:
    type: application
    platform: macOS
    sources:
      - App
      - path: Resources/Music
        buildPhase: resources
    dependencies:
      - target: GullfireKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.big-shame-software.Gullfire
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gullfire
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "N©! Big Shame Software 2026. No rights reserved."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.simulation-games
        MARKETING_VERSION: "1.2.1"
        CURRENT_PROJECT_VERSION: "5"
schemes:
  Gullfire:
    build:
      targets:
        Gullfire: all
    run:
      config: Debug
